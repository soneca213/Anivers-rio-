<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetLingo Expert</title>
    <style>
        :root {
            --green: #58cc02;
            --dark-green: #46a302;
            --red: #ff4b4b;
            --blue: #1cb0f6;
            --gray: #e5e5e5;
            --text: #4b4b4b;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fff;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0; padding: 20px;
        }

        .header { width: 100%; max-width: 600px; display: flex; align-items: center; gap: 15px; margin-bottom: 40px; }
        .progress-bar { flex-grow: 1; height: 16px; background-color: var(--gray); border-radius: 10px; }
        #progress { width: 0%; height: 100%; background-color: var(--green); border-radius: 10px; transition: 0.5s; }

        .card { width: 100%; max-width: 500px; }
        h2 { font-size: 22px; text-align: center; margin-bottom: 25px; }

        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            padding: 15px; border: 2px solid var(--gray); border-bottom: 4px solid var(--gray);
            border-radius: 15px; background: white; cursor: pointer; font-size: 16px;
            font-weight: bold; transition: 0.1s; text-align: left;
        }
        .option-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        /* Estilos de Feedback */
        .correct { background-color: #d7ffb8 !important; border-color: var(--green) !important; color: var(--dark-green) !important; }
        .wrong { background-color: #ffdfe0 !important; border-color: var(--red) !important; color: var(--red) !important; }

        .explanation-box {
            margin-top: 20px; padding: 15px; border-radius: 15px; display: none;
            font-size: 14px; line-height: 1.4; animation: slideUp 0.3s ease;
        }
        .explanation-correct { background-color: #d7ffb8; border: 1px solid var(--green); }
        .explanation-wrong { background-color: #ffdfe0; border: 1px solid var(--red); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .footer { position: fixed; bottom: 0; width: 100%; padding: 20px; border-top: 2px solid var(--gray); display: flex; justify-content: center; background: white; }
        #next-btn {
            width: 80%; max-width: 400px; padding: 15px; background-color: var(--green);
            color: white; border: none; border-radius: 15px; border-bottom: 4px solid var(--dark-green);
            font-size: 18px; font-weight: bold; cursor: pointer; display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <span style="font-size: 24px;">🐾</span>
        <div class="progress-bar"><div id="progress"></div></div>
        <span id="score" style="font-weight: bold;">0</span>
    </div>

    <div class="card">
        <h2 id="question"></h2>
        <div class="options" id="options-container"></div>
        <div id="explanation" class="explanation-box"></div>
    </div>

    <div class="footer">
        <button id="next-btn" onclick="nextQuestion()">VERIFICAR</button>
    </div>

    <script>
        const questions = [
            {
                q: "Por que não podemos aplicar vacinas em qualquer lugar do corpo de um gato?",
                options: [
                    "Porque o gato sente mais dor nas costas.",
                    "Para evitar o sarcoma (um tipo de tumor no local da aplicação).",
                    "Porque a vacina só funciona se for na pata.",
                    "Porque o pelo não cresce mais onde vacina."
                ],
                correct: 1,
                why: "Gatos têm uma sensibilidade especial! Aplicar mais abaixo nas patas ajuda a monitorar e prevenir o sarcoma vacinal."
            },
            {
                q: "Qual a função principal dos ossos?",
                options: [
                    "Apenas para guardar cálcio.",
                    "Fazer o sangue circular mais rápido.",
                    "Sustentação e proteção de órgãos vitais.",
                    "Transformar comida em energia."
                ],
                correct: 2,
                why: "Os ossos são as vigas do prédio! Eles seguram o corpo em pé e protegem o 'tesouro' (coração e pulmões)."
            },
            {
                q: "O que acontece na Diástole do coração?",
                options: [
                    "O coração para de bater por 2 segundos.",
                    "O coração aperta para o sangue sair.",
                    "O coração relaxa para se encher de sangue.",
                    "O sangue troca de cor dentro do ventrículo."
                ],
                correct: 2,
                why: "Pense em 'D' de Descanso. Na Diástole o coração relaxa para receber o sangue que vai ser bombeado depois."
            }
        ];

        let currentIdx = 0;
        let score = parseInt(localStorage.getItem('vetScore')) || 0;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            document.getElementById('question').innerText = q.q;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            const expBox = document.getElementById('explanation');
            expBox.style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('score').innerText = score;

            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(i, btn);
                container.appendChild(btn);
            });
            updateProgress();
        }

        function checkAnswer(selected, btn) {
            const q = questions[currentIdx];
            const allBtns = document.querySelectorAll('.option-btn');
            const expBox = document.getElementById('explanation');
            
            allBtns.forEach(b => b.disabled = true);
            expBox.style.display = 'block';

            if (selected === q.correct) {
                btn.classList.add('correct');
                expBox.className = 'explanation-box explanation-correct';
                expBox.innerHTML = `<b>Acertou! ✨</b><br>${q.why}`;
                playSound(880);
                score += 10;
                localStorage.setItem('vetScore', score);
            } else {
                btn.classList.add('wrong');
                allBtns[q.correct].classList.add('correct');
                expBox.className = 'explanation-box explanation-wrong';
                expBox.innerHTML = `<b>Ops! O certo era:</b> ${q.options[q.correct]}<br><br><b>Por que?</b> ${q.why}`;
                playSound(220);
            }
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('next-btn').innerText = "PRÓXIMA";
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx >= questions.length) {
                currentIdx = 0;
                alert("Ciclo concluído! Você está ficando fera!");
            }
            loadQuestion();
        }

        function updateProgress() {
            const percent = (currentIdx / questions.length) * 100;
            document.getElementById('progress').style.width = percent + '%';
        }

        loadQuestion();
    </script>
</body>
</html>
